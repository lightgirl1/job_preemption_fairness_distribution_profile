[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lightgirl1-job_preemption_fairness_distribution_profile"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别具身智能算法工程师·作业抢占与调度公平性上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "lightgirl1" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://lightgirl1.github.io"
Repository = "https://github.com/lightgirl1/job_preemption_fairness_distribution_profile"
Issues = "https://github.com/lightgirl1/job_preemption_fairness_distribution_profile/issues"

[project.scripts]
job_preemption_fairness_distribution_profile = "job_preemption_fairness_distribution_profile:main"

[tool.setuptools]
py-modules = ["job_preemption_fairness_distribution_profile"]
